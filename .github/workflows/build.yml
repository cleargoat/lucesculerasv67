
name: Build LightUtils Color v2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle --no-daemon build

      - name: Upload v2 JAR
        uses: actions/upload-artifact@v4
        with:
          name: lightutils-color-v2
          path: build/libs/lightutils-color-v2-2.0.0.jar
          if-no-files-found: error
